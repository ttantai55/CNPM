spring.application.name=brewlite-api
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/drinkshop_db}
spring.datasource.username=${DATABASE_USERNAME:brewlite}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.hibernate.ddl-auto=none
# Kích hoạt chạy file data.sql mỗi khi server khởi động
spring.sql.init.mode=always
# Đợi Hibernate tạo/cập nhật bảng xong mới bắt đầu đổ dữ liệu vào
spring.jpa.defer-datasource-initialization=true
