spring.application.name=brewlite-api
server.port=${PORT:${SERVER_PORT:8081}}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://brewlite-frontend-omega.vercel.app}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/drinkshop_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:brewlite}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:taidz@2026}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.open-in-view=true
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
