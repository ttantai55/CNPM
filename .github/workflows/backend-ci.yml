name: Backend Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-ci:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/backend

    steps:
      - name: Lấy mã nguồn về máy ảo
        uses: actions/checkout@v4

      
      # CÁC BƯỚC SUPABASE ĐƯỢC THÊM VÀO TẠI ĐÂY
     
      - name: Cài đặt Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 'latest'

      - name: Đẩy cấu trúc và dữ liệu lên Supabase
        working-directory: ./ # Ép chạy ở thư mục gốc chứa thư mục supabase/
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase link --project-ref $SUPABASE_PROJECT_ID
          supabase db push --remote --password $SUPABASE_DB_PASSWORD --yes
      # ==========================================

      - name: Cài đặt môi trường Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: apps/backend/pom.xml

      - name: Cấp quyền thực thi cho Maven Wrapper
        run: |
          if [ -f "./mvnw" ]; then
            chmod +x ./mvnw
          fi

      - name: Bước 1 - Install (Tải thư viện)
        run: |
          if [ -f "./mvnw" ]; then
            ./mvnw dependency:resolve
          else
            mvn dependency:resolve
          fi

      - name: Bước 2 - Lint (Kiểm tra định dạng code)
        run: |
          if [ -f "./mvnw" ]; then
            ./mvnw checkstyle:check
          else
            mvn checkstyle:check
          fi

      - name: Bước 3 - Unit Test (Kiểm tra biên dịch test)
        run: |
          if [ -f "./mvnw" ]; then
            ./mvnw test -DskipTests
          else
            mvn test -DskipTests
          fi

      - name: Bước 4 - Build (Đóng gói ứng dụng)
        run: |
          if [ -f "./mvnw" ]; then
            ./mvnw clean package -DskipTests
          else
            mvn clean package -DskipTests
          fi

      - name: Lưu trữ Artifact Jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: apps/backend/target/*.jar
          retention-days: 1