name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: apps/backend/pom.xml
      - name: Run backend tests
        working-directory: apps/backend
        run: chmod +x ./mvnw && ./mvnw test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml
      - name: Build frontend
        working-directory: apps/frontend
        run: pnpm install --frozen-lockfile && pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: test/pnpm-lock.yaml
      - name: Install Cypress
        working-directory: test
        run: pnpm install --frozen-lockfile
      - name: Start Compose stack
        run: docker compose up --build --detach --wait
      - name: Run Cypress
        working-directory: test
        run: pnpm exec cypress run
      - name: Stop Compose stack
        if: always()
        run: docker compose down -v
