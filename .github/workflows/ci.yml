name: CNPM

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Kéo toàn bộ source code về runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Bước 2: Cài đặt môi trường JDK (chọn phiên bản tương ứng với project của bạn, vd: 17 hoặc 21)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven # Tự động cache dependency để các lần chạy sau nhanh hơn

      # Bước 3: Cấp quyền thực thi cho Maven Wrapper (nếu dùng mvnw)
      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw
        if: hashFiles('mvnw') != ''

      # Bước 4: Compile và chạy Unit Test
      - name: Build and run tests with Maven
        run: |
          if [ -f "./mvnw" ]; then
            ./mvnw clean test
          else
            mvn clean test
          fi