name: Frontend Pipeline

on:
  push:
    branches: "main"
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: "main"
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/frontend/package-lock.json'

      - name: Bước 1 - Cài đặt Dependencies
        run: npm install

      - name: Bước 2 - Lint (Kiểm tra quy chuẩn mã nguồn)
        run: npm run lint
        continue-on-error: true

      - name: Bước 3 - Biên dịch Build Frontend
        run: npm run build