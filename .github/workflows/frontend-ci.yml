name: Frontend Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Cài đặt Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'apps/frontend/pnpm-lock.yaml'

      - name: Bước 1 - Cài đặt Dependencies
        run: pnpm install --frozen-lockfile

      - name: Bước 2 - Kiểm tra TypeScript
        run: pnpm exec tsc --noEmit

      - name: Bước 3 - Biên dịch Build Frontend
        run: pnpm run build

  cypress-e2e:
    name: Cypress Payment E2E
    runs-on: ubuntu-latest
    needs: frontend-ci

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Cài đặt Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: test/pnpm-lock.yaml

      - name: Khởi động hệ thống qua Docker Compose
        run: docker compose up --build --detach --wait

      - name: Cài Cypress và chạy E2E
        working-directory: test
        run: |
          pnpm install --frozen-lockfile
          pnpm cy:run

      - name: Dừng dịch vụ Docker Compose
        if: always()
        run: docker compose down --volumes