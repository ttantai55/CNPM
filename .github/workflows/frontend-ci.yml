name: Frontend Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Cài đặt Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'apps/frontend/pnpm-lock.yaml'

      - name: Bước 1 - Cài đặt Dependencies
        run: pnpm install --frozen-lockfile

      - name: Bước 2 - Lint (không chặn CI)
        run: pnpm run lint
        continue-on-error: true

      - name: Bước 3 - Kiểm tra TypeScript
        run: pnpm run typecheck

      - name: Bước 4 - Biên dịch Build Frontend
        run: pnpm run build
