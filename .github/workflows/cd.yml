name: Backend Continuous Delivery

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Backend Lint and Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
          cache-dependency-path: apps/backend/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Run Checkstyle
        run: ./mvnw checkstyle:check

      - name: Run unit tests
        run: ./mvnw test

  build:
    name: Build Backend JAR
    needs: lint-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
          cache-dependency-path: apps/backend/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Package backend
        run: ./mvnw clean package -DskipTests

      - name: Upload backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: apps/backend/target/*.jar
          retention-days: 1

  deploy:
    name: Deploy to Render
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://brewlite-backend-c625.onrender.com

    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::Set the RENDER_DEPLOY_HOOK GitHub Actions secret to the Render deploy hook URL."
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"

  smoke-test:
    name: Check deployed backend health
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render health endpoint
        env:
          PROD_URL: https://brewlite-backend-c625.onrender.com
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error --max-time 10 "$PROD_URL/health"; then
              echo
              echo "Backend health check passed."
              exit 0
            fi
            echo "Health check attempt $attempt/40 failed; waiting 15 seconds."
            sleep 15
          done
          echo "::error::Backend did not become healthy at $PROD_URL/health"
          exit 1

  rollback:
    name: Render rollback notice
    needs: [deploy, smoke-test]
    if: failure() && needs.deploy.result == 'success' && needs.smoke-test.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Report required manual rollback
        run: |
          echo "::error::Deployment health check failed. Roll back to the last healthy deployment from the Render dashboard."
          echo "This workflow uses a Render deploy hook and cannot select a previous deployment for automatic rollback."
