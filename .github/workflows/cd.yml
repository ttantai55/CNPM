name: Backend CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build backend JAR
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          cache-dependency-path: apps/backend/pom.xml
      - name: Build
        run: chmod +x ./mvnw && ./mvnw clean package -DskipTests
      - name: Upload backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: apps/backend/target/*.jar
          retention-days: 1

  docker-image:
    name: Build Docker image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: apps/backend/target
      - name: Build Docker image
        run: docker build -t "brewlite-backend:${GITHUB_SHA}" ./apps/backend
      - name: Export Docker image
        run: docker save "brewlite-backend:${GITHUB_SHA}" -o backend-image.tar
      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: backend-docker-image
          path: backend-image.tar
          retention-days: 1
