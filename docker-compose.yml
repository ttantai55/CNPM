services:
  postgres:
    image: postgres:16-alpine
    container_name: drinkshop
    restart: unless-stopped
    environment:
      POSTGRES_DB: drinkshop_db
      POSTGRES_USER: brewlite
      POSTGRES_PASSWORD: taidz@2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./DB.sql/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      - ./DB.sql/data.sql:/docker-entrypoint-initdb.d/01-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brewlite -d drinkshop_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./apps/backend
    container_name: brewlite-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/drinkshop_db
      SPRING_DATASOURCE_USERNAME: brewlite
      SPRING_DATASOURCE_PASSWORD: taidz@2026
      DATABASE_PASSWORD: taidz@2026
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: