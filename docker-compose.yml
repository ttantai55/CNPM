services:
  postgres:
    image: postgres:16-alpine
    container_name: drinkshop_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: drinkshop_db
      POSTGRES_USER: brewlite
      POSTGRES_PASSWORD: taidz@2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./DB.sql/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      - ./DB.sql/data.sql:/docker-entrypoint-initdb.d/01-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brewlite -d drinkshop_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./apps/backend
    container_name: brewlite-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/drinkshop_db}
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USERNAME:-brewlite}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD:-taidz@2026}
      SPRING_SQL_INIT_MODE: ${SQL_INIT_MODE:-always}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
      build:
        context: ./apps/frontend
        args:
          BACKEND_URL: http://backend:8081
      container_name: brewlite-frontend
      restart: unless-stopped
      ports:
        - "3000:3000"
      depends_on:
        - backend

volumes:
  postgres_data: